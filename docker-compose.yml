services:
  app:
    build: .
    container_name: gestor_financiero_app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=gestor_financiero
      - DB_USER=root
      - DB_PASS=root
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: gestor_financiero_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=gestor_financiero
    volumes:
      - gestor_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gestor_db_data:

